name: Feature request
description: Suggest an improvement to Mnemosyne
body:
  - type: markdown
    attributes:
      value: Do not include secrets, real conversations, memory contents, or backups.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Mnemosyne solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contracts
    attributes:
      label: Contract impact
      options:
        - label: This may affect API, MCP, schema, retention, or security boundaries.
