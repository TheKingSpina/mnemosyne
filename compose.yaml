services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mnemosyne} -d ${POSTGRES_DB:-mnemosyne}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnemosyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemosyne}
      MNEMOSYNE_FORGET_SECRET: ${MNEMOSYNE_FORGET_SECRET:?MNEMOSYNE_FORGET_SECRET is required}
      MNEMOSYNE_OWNER_TOKEN: ${MNEMOSYNE_OWNER_TOKEN:?MNEMOSYNE_OWNER_TOKEN is required}
      MNEMOSYNE_HARNESS_TOKEN: ${MNEMOSYNE_HARNESS_TOKEN:?MNEMOSYNE_HARNESS_TOKEN is required}
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    stdin_open: true
    tty: false
    command: ['node', 'apps/mcp/dist/main.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnemosyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemosyne}
      MNEMOSYNE_FORGET_SECRET: ${MNEMOSYNE_FORGET_SECRET}
      MNEMOSYNE_OWNER_TOKEN: ${MNEMOSYNE_OWNER_TOKEN}
      MNEMOSYNE_HARNESS_TOKEN: ${MNEMOSYNE_HARNESS_TOKEN}
      MCP_PROFILE: ${MCP_PROFILE:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-3333}
      MCP_MAX_REQUEST_BODY_BYTES: ${MCP_MAX_REQUEST_BODY_BYTES:-1048576}
    ports:
      - '127.0.0.1:${MCP_HTTP_PORT:-3333}:${MCP_PORT:-3333}'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
      WEB_API_ORIGIN: http://api:3000
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnemosyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemosyne}
      MNEMOSYNE_FORGET_SECRET: ${MNEMOSYNE_FORGET_SECRET:?MNEMOSYNE_FORGET_SECRET is required}
      WORKER_ID: ${WORKER_ID:-}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_BACKOFF_MS: ${WORKER_BACKOFF_MS:-1000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
