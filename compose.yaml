services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnemosyne}
      POSTGRES_USER: ${POSTGRES_USER:-mnemosyne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mnemosyne} -d ${POSTGRES_DB:-mnemosyne}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnemosyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemosyne}
      MNEMOSYNE_FORGET_SECRET: ${MNEMOSYNE_FORGET_SECRET:?MNEMOSYNE_FORGET_SECRET is required}
      API_HOST: 0.0.0.0
      API_PORT: 3000
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    stdin_open: true
    tty: false
    command: ['node', 'apps/mcp/dist/main.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnemosyne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mnemosyne}
      MNEMOSYNE_FORGET_SECRET: ${MNEMOSYNE_FORGET_SECRET}
      MCP_PROFILE: ${MCP_PROFILE:-harness}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-stdio}
      MCP_HOST: ${MCP_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-3333}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
    ports:
      - '127.0.0.1:${MCP_HTTP_PORT:-3333}:${MCP_PORT:-3333}'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
