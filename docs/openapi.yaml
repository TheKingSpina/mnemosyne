        '413':
          description: Il corpo della richiesta supera il limite di 1.048.576 byte.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/context/resolve:
    post:
      tags:
        - Context
      operationId: resolveMemoryContext
      summary: Compone contesto strutturato entro un budget di token
      description: Operazione di lettura modellata come POST perché il budget e la
        query sono un body validato. Non richiede Idempotency-Key.
      x-required-profile: harness_or_owner
      requestBody:
        required: true
        description: 'Corpo JSON; limite massimo applicato: 1,048,576 byte.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextInput'
      responses:
        '200':
          description: Contesto approvato e stato del servizio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflitto di stato, versione, idempotenza o precondizione.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '413':
          description: Il corpo della richiesta supera il limite di 1.048.576 byte.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/memories:
    get:
      tags:
        - Memories
      operationId: searchMemories
      summary: Cerca memorie approvate visibili alla sessione
      x-required-profile: harness_or_owner
      parameters:
        - name: sessionId
          in: query
          required: true
          description: Sessione che determina gli scope visibili.
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          required: true
          description: Query lessicale e semantica.
          schema:
            type: string
            minLength: 1
            maxLength: 2000
        - name: scopeType
          in: query
          required: false
          description: Filtro opzionale; deve essere accompagnato da scopeId.
          schema:
            type: string
            enum:
              - session
              - project
              - area
              - global
        - name: scopeId
          in: query
          required: false
          description: Identificatore esatto dello scope.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: Numero massimo di elementi da restituire.
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          description: Numero di elementi da saltare.
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: Memorie recuperate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchMemoriesOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '404':
          description: Risorsa o rotta non trovata.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/memories/{id}:
    get:
      tags:
        - Memories
      operationId: getMemory
      summary: Legge una memoria
      description: Il profilo harness riceve la revisione corrente solo se è accepted.
        Il profilo owner riceve anche record, revisioni e conflitti.
      x-required-profile: harness_or_owner
      parameters:
        - name: id
          in: path
          required: true
          description: Identificatore sintetico o opaco restituito dal servizio.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Memoria o vista amministrativa.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MemoryView'
                  - $ref: '#/components/schemas/MemoryAdminView'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
