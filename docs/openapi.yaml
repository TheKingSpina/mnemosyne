              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '404':
          description: Risorsa o rotta non trovata.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/proposals/{id}/decision:
    post:
      tags:
        - Memories
      operationId: reviewMemoryProposal
      summary: Accetta o respinge una proposal pending
      x-required-profile: owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          description: Identificatore sintetico o opaco restituito dal servizio.
          schema:
            type: string
            minLength: 1
      requestBody:
