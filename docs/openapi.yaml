  /v1/proposals:
    post:
      tags:
        - Memories
      operationId: proposeMemory
      summary: Propone una memoria governata dalla policy
      description: Le proposal del profilo harness restano pending finché il owner non
        le revisiona. Il servizio valida sempre il risultato, anche per un token
        owner.
      x-required-profile: harness_or_owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 'Corpo JSON; limite massimo applicato: 1,048,576 byte.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeMemoryInput'
      responses:
        '201':
          description: Proposta creata, accettata, unita o respinta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResult'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflitto di stato, versione, idempotenza o precondizione.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '413':
          description: Il corpo della richiesta supera il limite di 1.048.576 byte.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
    get:
      tags:
        - Memories
      operationId: listPendingProposals
      summary: Elenca le candidate pending accessibili alla sessione
      x-required-profile: owner
      parameters:
        - name: sessionId
          in: query
          required: true
          description: Sessione da cui leggere le candidate.
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: Numero massimo di elementi da restituire.
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Numero di elementi da saltare.
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: Candidate pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingProposalsOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
