openapi: 3.1.0
info:
  title: Mnemosyne REST API
  version: 0.1.0
  description: >-
    API monoutente per il Mnemosyne. PostgreSQL è la fonte autorevole; Redis,
    pgvector e Neo4j sono proiezioni derivate.


    I corpi JSON sono limitati a 1.048.576 byte. Nel deployment API ogni
    operazione POST che modifica lo stato richiede `Idempotency-Key`; `POST
    /v1/context/resolve` e `POST /v1/memories/{id}/forget/prepare` sono esenti
    perché non scrivono il corpus.


    I token `owner` e `harness` sono scambiati tramite lo stesso schema Bearer
    ma hanno autorizzazioni diverse, descritte per operazione.


    Il documento pubblico `/v1/openapi.json` non contiene dati del corpus ed è
    servito senza autenticazione con cache `no-store`.
  license:
    name: GNU Affero General Public License v3.0 only
    url: https://www.gnu.org/licenses/agpl-3.0.html
externalDocs:
  description: Specifica tecnica e limiti del progetto
  url: https://github.com/TheKingSpina/mnemosyne/blob/main/docs/assistante-memoriale-spec.md
servers:
  - url: http://127.0.0.1:3000
    description: Deployment locale di sviluppo; non esporre questa porta
      direttamente a Internet.
tags:
  - name: Discovery
    description: Salute e contratto API.
  - name: Sessions
    description: Ciclo di vita ed eventi delle sessioni.
  - name: Memories
    description: Proposal, retrieval e lifecycle delle memorie.
  - name: Context
    description: Composizione del contesto approvato.
  - name: Jobs
    description: Stato dei job asincroni.
  - name: Administration
    description: Operazioni riservate al profilo owner.
security:
  - bearerAuth: []
paths:
  /v1/openapi.json:
    get:
      tags:
        - Discovery
      operationId: getOpenApiDocument
      summary: Restituisce il contratto OpenAPI corrente
      description: Operazione pubblica. Il documento contiene soltanto metadati API e
        non richiede credenziali.
      security: []
      x-required-profile: public
      responses:
        '200':
          description: Contratto OpenAPI 3.1.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '405':
          description: Metodo HTTP non consentito.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /health/live:
    get:
      tags:
        - Discovery
      operationId: getLiveness
      summary: Verifica che il processo API sia attivo
      description: Endpoint pubblico che non verifica PostgreSQL.
      security: []
      x-required-profile: public
      responses:
        '200':
          description: Processo attivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                  - status
                additionalProperties: false
        '405':
          description: Metodo HTTP non consentito.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /health/ready:
    get:
      tags:
        - Discovery
      operationId: getReadiness
      summary: Verifica che la fonte autorevole sia raggiungibile
      description: Endpoint pubblico. Restituisce errore se PostgreSQL non può fornire
        la revisione del corpus.
      security: []
      x-required-profile: public
      responses:
        '200':
          description: Fonte autorevole raggiungibile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
                required:
                  - status
                additionalProperties: false
        '405':
          description: Metodo HTTP non consentito.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/sessions:
    post:
      tags:
        - Sessions
      operationId: openSession
      summary: Apre una sessione di lavoro
      x-required-profile: harness_or_owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 'Corpo JSON; limite massimo applicato: 1,048,576 byte.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionInput'
      responses:
        '201':
          description: Sessione creata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenSessionOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflitto di stato, versione, idempotenza o precondizione.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '413':
          description: Il corpo della richiesta supera il limite di 1.048.576 byte.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/sessions/{id}/events:
    post:
      tags:
        - Sessions
      operationId: recordSessionEvents
      summary: Registra eventi idempotenti per una sessione
      description: Gli eventi sono unici per `sessionId + eventId`. Ogni batch con
        almeno un nuovo evento accoduta un job di estrazione.
      x-required-profile: harness_or_owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          description: Identificatore sintetico o opaco restituito dal servizio.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        description: 'Corpo JSON; limite massimo applicato: 1,048,576 byte.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordEventsRequest'
      responses:
        '202':
          description: Eventi accettati e job enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordEventsOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
          description: Il profilo autenticato non ha il permesso richiesto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '404':
          description: Risorsa o rotta non trovata.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflitto di stato, versione, idempotenza o precondizione.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '413':
          description: Il corpo della richiesta supera il limite di 1.048.576 byte.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '500':
          description: Errore interno non esposto nei dettagli.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
  /v1/sessions/{id}/close:
    post:
      tags:
        - Sessions
      operationId: closeSession
      summary: Chiude la sessione e avvia il consolidamento
      x-required-profile: harness_or_owner
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          description: Identificatore sintetico o opaco restituito dal servizio.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: false
        description: 'Corpo JSON opzionale; quando presente deve essere un oggetto
          vuoto. Il server accetta anche un body assente. Limite massimo:
          1,048,576 byte.'
        content:
          application/json:
            schema: &a1
              type: object
              properties: {}
      responses:
        '202':
          description: Sessione chiusa e job di consolidamento enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseSessionOutput'
        '400':
          description: Richiesta non valida, JSON non valido o Idempotency-Key mancante.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '401':
          description: Bearer token assente o non valido.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ApiProblem'
                  - $ref: '#/components/schemas/ApiError'
        '403':
