components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Usa MNEMOSYNE_OWNER_TOKEN oppure MNEMOSYNE_HARNESS_TOKEN. Il
        profilo è determinato dal token, non dallo schema HTTP.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chiave 1–200 caratteri `[A-Za-z0-9._:-]`. La stessa chiave, attore,
        metodo, path e JSON replayano la risposta; un fingerprint diverso
        restituisce 409.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,200}$
  schemas:
    OpenSessionInput:
      type: object
      properties:
        projectId:
          type: string
          minLength: 1
        areaIds:
          type: array
          items:
            type: string
            minLength: 1
        taskTitle:
          type: string
          maxLength: 500
      required:
        - projectId
    OpenSessionOutput:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
        projectId:
          type: string
          minLength: 1
        areaIds:
          type: array
          items:
            type: string
        corpusRevision:
          type: string
          minLength: 1
      required:
        - sessionId
        - projectId
        - areaIds
        - corpusRevision
      additionalProperties: false
    RecordEventsRequest:
      type: object
      properties:
        events:
          minItems: 1
          maxItems: 100
          type: array
          items:
            type: object
            properties:
              eventId:
                type: string
                minLength: 1
              type:
                type: string
                const: message
              role:
                type: string
                enum:
                  - user
                  - assistant
                  - tool
              content:
                type: string
                minLength: 1
                maxLength: 100000
              occurredAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              explicitMemoryRequest:
                default: false
                type: boolean
            required:
              - eventId
              - type
              - role
              - content
              - occurredAt
      required:
        - events
    RecordEventsOutput:
      type: object
      properties:
        acceptedEventIds:
          type: array
          items:
            type: string
        duplicateEventIds:
          type: array
          items:
            type: string
        jobIds:
          type: array
          items:
            type: string
      required:
        - acceptedEventIds
        - duplicateEventIds
        - jobIds
      additionalProperties: false
    CloseSessionOutput:
      type: object
      properties:
        jobId:
          type: string
          minLength: 1
      required:
        - jobId
      additionalProperties: false
    ProposeMemoryInput:
      type: object
      properties:
        sessionId:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
          maxLength: 10000
        kind:
          type: string
          enum:
            - fact
            - preference
            - instruction
            - decision
            - convention
            - constraint
            - goal
            - hypothesis
            - episode
        scope:
          type: object
          properties:
            type:
              type: string
              enum:
                - session
                - project
                - area
                - global
            id:
              type: string
              minLength: 1
          required:
            - type
            - id
        epistemicBasis:
          type: string
          enum:
            - user_asserted
            - observed
            - verified
            - inferred
            - unknown
        assessment:
          default: uncontested
          type: string
          enum:
            - uncontested
            - disputed
        confidence:
          default: null
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: 'null'
        sensitivity:
          default: normal
          type: string
          enum:
            - normal
            - private
            - sensitive
            - secret
        activation:
          default: on_demand
          type: string
          enum:
            - always
            - on_demand
        sourceEventIds:
          default: []
          type: array
          items:
            type: string
            minLength: 1
      required:
        - sessionId
        - content
        - kind
        - scope
        - epistemicBasis
    ProposalResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - accepted
            - pending_approval
            - rejected
            - merged
        memoryId:
          type: string
        proposalId:
          type: string
        conflictId:
          type: string
        jobId:
          type: string
        reason:
          type: string
      required:
        - status
      additionalProperties: false
    PendingProposalsOutput:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              memoryId:
                type: string
                minLength: 1
              version:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
              content:
                type: string
                minLength: 1
                maxLength: 10000
              kind:
                type: string
                enum:
                  - fact
                  - preference
                  - instruction
                  - decision
                  - convention
                  - constraint
                  - goal
                  - hypothesis
                  - episode
              scope:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                      - session
                      - project
                      - area
                      - global
                  id:
                    type: string
                    minLength: 1
                required:
                  - type
                  - id
                additionalProperties: false
              epistemicBasis:
                type: string
                enum:
                  - user_asserted
                  - observed
                  - verified
                  - inferred
                  - unknown
              assessment:
                type: string
                enum:
                  - uncontested
                  - disputed
              confidence:
                anyOf:
                  - type: number
                    minimum: 0
                    maximum: 1
                  - type: 'null'
              sensitivity:
                type: string
                enum:
                  - normal
                  - private
                  - sensitive
                  - secret
              activation:
                type: string
                enum:
                  - always
                  - on_demand
              sourceEventIds:
                default: []
                type: array
                items:
                  type: string
                  minLength: 1
              lifecycle:
                type: string
                enum:
                  - candidate
                  - pending_approval
                  - accepted
                  - rejected
                  - superseded
                  - expired
                  - retracted
                  - forgotten
              currentVersion:
                type: integer
                exclusiveMinimum: 0
                maximum: 9007199254740991
              createdAt:
                type: string
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
              updatedAt:
